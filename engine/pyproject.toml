[project]
name = "datahub-engine"
version = "0.1.0"
description = "Motor de execução do DataHub SEDUC-MT: ferramentas de planilha e registro de logs."
requires-python = ">=3.11"
dependencies = [
  "openpyxl==3.1.5",
  "xlrd==2.0.2",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1"]

[project.scripts]
datahub-engine = "datahub_engine.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["datahub_engine*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
